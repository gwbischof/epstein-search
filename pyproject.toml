[project]
name = "epstein-search"
version = "0.2.0"
description = "Python and CLI client for the DOJ Epstein Library search API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5",
    "pdfplumber>=0.11.0",
    "mcp[cli]>=1.9.1",
    "pymupdf>=1.26.0",
    "reportlab>=4.4.9",
]

[project.urls]
Repository = "https://github.com/gwbischof/epstein-search"

[project.scripts]
es = "cli:main"
estl = "timeline:main"
epstein-search-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["client.py", "cli.py", "timeline.py", "mcp_server.py", "pdf.py"]
