name: Deploy MCP to vector-mcp.korroni.cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output image
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to korroni.cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            CONTAINER_NAME="epstein-search-mcp"
            IMAGE_NAME="${{ needs.build-and-push.outputs.image }}"
            NETWORK="root_default"
            DOMAIN="${{ vars.DEPLOY_DOMAIN }}"

            echo "Starting deployment of Epstein Search MCP..."

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Pulling latest image..."
            docker pull "$IMAGE_NAME"

            if docker ps --format "table {{.Names}}" | grep -q "^$CONTAINER_NAME$"; then
              echo "Stopping existing container..."
              docker stop "$CONTAINER_NAME"
            fi

            if docker ps -a --format "table {{.Names}}" | grep -q "^$CONTAINER_NAME$"; then
              echo "Removing existing container..."
              docker rm "$CONTAINER_NAME"
            fi

            echo "Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --network "$NETWORK" \
              -e VECTOR_API_KEY="${{ secrets.VECTOR_API_KEY }}" \
              -e MCP_PATH_SECRET="${{ secrets.MCP_PATH_SECRET }}" \
              -l "traefik.enable=true" \
              -l "traefik.http.routers.epstein-search-mcp.rule=Host(\`$DOMAIN\`)" \
              -l "traefik.http.routers.epstein-search-mcp.tls=true" \
              -l "traefik.http.routers.epstein-search-mcp.tls.certresolver=myresolver" \
              -l "traefik.http.services.epstein-search-mcp.loadbalancer.server.port=8000" \
              "$IMAGE_NAME"

            echo "Waiting for container to be ready..."
            sleep 10

            if docker ps --format "table {{.Names}}" | grep -q "^$CONTAINER_NAME$"; then
              echo "Container is running!"
            else
              echo "Container failed to start!"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            docker image prune -f

            echo "Deployment completed!"
            echo "Application available at: https://$DOMAIN"
